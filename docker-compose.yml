version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: painel-apis-app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    # command: tail -f /dev/null
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: painel-apis-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: painel
      MYSQL_USER: painel_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  node:
      image: node:18
      container_name: painel-apis-node
      working_dir: /var/www/html
      volumes:
        - ./src:/var/www/html
      command: sleep infinity

volumes:
  db_data: